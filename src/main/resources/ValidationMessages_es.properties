validation.plan-code.not-blank=planCode es obligatorio y no debe estar vacío
validation.plan-code.size=planCode debe tener como máximo {max} caracteres
validation.station-id.not-blank=stationId es obligatorio
validation.station-id.uuid=stationId debe ser un UUID válido
validation.sampling-window-start-date.not-null=samplingWindowStartDate es obligatorio
validation.sampling-window-end-date.not-null=samplingWindowEndDate es obligatorio
validation.sampling-window.order=samplingWindowEndDate debe ser posterior a samplingWindowStartDate
validation.sample-volume-quantity.not-null=sampleVolumeQuantity es obligatorio
validation.sample-volume-quantity.positive=sampleVolumeQuantity debe ser mayor que 0
validation.sample-volume-unit.not-blank=sampleVolumeUnit es obligatorio y no debe estar vacío
validation.sample-volume-unit.size=sampleVolumeUnit debe tener como máximo {max} caracteres
validation.priority-level.not-null=priorityLevel es obligatorio
validation.priority-level.range=priorityLevel debe estar entre 1 y 5
validation.status.invalid=status debe ser uno de PENDING, APPROVED, COMPLETED, CANCELLED
validation.status.not-null=status no debe ser null cuando se envía (omítalo para usar PENDING)
validation.sampling-notes.size=samplingNotes debe tener como máximo {max} caracteres
